<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>星绪</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="xingxu.css">
</head>
<body>

    <header class="header">
        <button class="header-action-btn" id="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="header-actions">
            <button class="header-action-btn" id="game-redirect-btn"><i class="fa-solid fa-gamepad"></i></button>
            <button class="header-action-btn" id="add-chat-btn"><i class="fa-solid fa-plus"></i></button>
        </div>
    </header>

    <main class="content-container">
        <div id="chat-page" class="page active">
            <div id="chat-list-area">
                <!-- 聊天列表将由 JS 动态生成到这里 -->
            </div>
        </div>

        <div id="moments-page" class="page">
            <h1>动态区</h1>
            <p>此功能待开发</p>
        </div>

        <div id="profile-page" class="page">
            <h1>我的</h1>
            <p>个人中心功能待开发</p>
        </div>
    </main>

    <div class="modal-overlay" id="char-select-overlay">
        <div class="modal-panel">
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="single-chat">单聊</button>
                <button class="modal-tab disabled" data-tab="group-chat">群聊</button>
            </div>
            <div class="modal-content-container">
                <div id="single-chat-content" class="modal-tab-content active">
                    <div class="sheet-body-list" id="char-list-container">
                        <!-- 角色列表将由 JS 动态生成到这里 -->
                    </div>
                </div>
                <div id="group-chat-content" class="modal-tab-content">
                    <p class="no-char-message">群聊功能开发中...</p>
                </div>
            </div>
            <div class="sheet-footer">
                <button class="sheet-btn sheet-btn-cancel" id="cancel-selection-btn">取消</button>
                <button class="sheet-btn sheet-btn-confirm" id="confirm-selection-btn">确定</button>
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <a href="#" class="tab-item active" data-page="chat-page">
            <i class="fa-solid fa-comment-dots icon"></i>
        </a>
        <a href="#" class="tab-item" data-page="moments-page">
            <i class="fa-solid fa-compass icon"></i>
        </a>
        <a href="#" class="tab-item" data-page="profile-page">
            <i class="fa-solid fa-user icon"></i>
        </a>
    </nav>
    
    <!-- ▼▼▼ 新增：侧边菜单 ▼▼▼ -->
    <div class="side-menu-overlay" id="side-menu-overlay">
        <div class="side-menu" id="side-menu">
            <div class="side-menu-header">
                <!-- ▼▼▼ 核心修复：更换头像链接 ▼▼▼ -->
                <img src="https://i.postimg.cc/Yq19VCkN/afelotus.jpg" alt="User Avatar" class="user-avatar">
                <!-- ▲▲▲ 修复结束 ▲▲▲ -->
                <span class="user-name">程序员小C</span>
            </div>
            <ul class="side-menu-list">
                <li><a href="#"><i class="fa-solid fa-gear icon"></i> 设置</a></li>
                <li><a href="#"><i class="fa-solid fa-circle-info icon"></i> 关于</a></li>
                <li><a href="#"><i class="fa-solid fa-share-nodes icon"></i> 分享应用</a></li>
            </ul>
        </div>
    </div>
    <!-- ▲▲▲ 新增结束 ▲▲▲ -->

    <!-- JS 库 -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="xingxu.js" type="module"></script>

</body>
</html>
