<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC交友</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">

    <!-- 内联专属样式 (这部分保持不变) -->
    <style>
        /* (你原来的所有 CSS 样式都在这里，为了简洁省略了，实际使用时请保留) */
        /* --- 基础与重置样式 --- */
        * { box-sizing: border-box; }
        body { background-color: #f4f7f9; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; line-height: 1.6; }
        /* --- 页面头部样式 --- */
        .page-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background-color: #ffffff; position: sticky; top: 0; z-index: 100; }
        .page-title { font-size: 1.2em; font-weight: 600; color: #495057; display: flex; align-items: center; margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .header-actions button, .header-actions a { width: 32px; height: 32px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; text-decoration: none; }
        .btn-help { background-color: #FCE4EC; color: #FFA7C4; font-size: 16px; }
        .btn-help:hover { background-color: #FFA7C4; color: #ffffff; transform: scale(1.1); }
        .btn-back { background-color: #f1f3f5; color: #868e96; font-size: 20px; }
        .btn-back:hover { background-color: #e9ecef; color: #495057; }
        .btn-save { background-color: #B9A2E9; color: #ffffff; font-size: 16px; }
        .btn-save:hover { background-color: #a68ed6; transform: scale(1.1); }
        /* --- 主体内容容器 --- */
        .main-container { width: 100%; max-width: 800px; margin: 0 auto; }
        .content-body { padding: 20px 15px; }
        /* --- 条目列表与按钮样式 --- */
        .entry-list { display: flex; flex-direction: column; gap: 12px; }
        .add-entry-btn { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background-color: #ffffff; border: 1px solid #e9ecef; border-radius: 8px; text-decoration: none; color: #495057; transition: all 0.2s ease; }
        .add-entry-btn:hover { border-color: #ced4da; background-color: #f8f9fa; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }
        .add-entry-btn i { font-size: 1em; color: #adb5bd; margin-right: 0; }
        .add-entry-btn span { font-size: 1em; font-weight: 500; }
        /* --- 好友列表样式 --- */
        .friend-list-container { background-color: #ffffff; border: 1px solid #e9ecef; border-radius: 8px; margin-top: 20px; padding: 15px 20px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #f1f3f5; margin-bottom: 12px; }
        .list-title { font-size: 1em; font-weight: 600; color: #495057; margin: 0; }
        .list-actions { display: flex; align-items: center; gap: 18px; }
        .action-btn { background: none; border: none; padding: 0; cursor: pointer; color: #868e96; font-size: 1.1em; transition: color 0.2s ease; }
        .action-btn:hover { color: #343a40; }
        .action-btn-delete { color: #FF9699; }
        .action-btn-delete:hover { color: #f56c6c; }
        .placeholder-text { text-align: center; color: #adb5bd; padding: 20px 0; font-size: 0.9em; }
    </style>
</head>
<body>
    <!-- 
      这里不再需要 <script src="../common/template.js"></script> 
      我们将在下面的模块脚本中导入它
    -->
    
    <!-- ▼▼▼ 核心修改：合并为一个模块脚本 ▼▼▼ -->
    <script type="module">
        // 1. 从模块中导入 createPageLayout 函数
        import { createPageLayout } from '../common/template.js';

        // 2. 统一使用一个 DOMContentLoaded 事件
        document.addEventListener('DOMContentLoaded', () => {

            // --- 页面生成逻辑 ---

            const friendNpcPageContent = `
                <div class="entry-list">
                    <a href="#" class="add-entry-btn">
                        <span>新朋友</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </a>
                </div>

                <div class="friend-list-container">
                    <div class="list-header">
                        <h2 class="list-title">好友列表</h2>
                        <div class="list-actions">
                            <button class="action-btn" title="多选">
                                <i class="fa-solid fa-check-double"></i>
                            </button>
                            <button class="action-btn action-btn-delete" title="删除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="list-content">
                        <p class="placeholder-text">暂无好友</p>
                    </div>
                </div>
            `;

            const handleFriendNpcFeatherClick = () => {
                console.log('NPC交友页面的羽毛笔被点击，准备添加新朋友。');
                alert('“添加新NPC好友”功能正在开发中！');
            };

            // 3. 调用函数，生成页面布局
            // 注意：你的模板函数可能没有实现 showBackButton 和 showSaveButton
            // 这里我假设它会生成一个 id="save-btn" 的按钮
            createPageLayout({
                title: 'NPC交友',
                contentHtml: friendNpcPageContent,
                onFeatherClick: handleFriendNpcFeatherClick,
            });

            // --- 页面交互逻辑 ---

            // 4. 页面已生成，直接查找按钮并绑定事件 (不再需要 MutationObserver)
            // 假设你的模板会生成一个 id 为 'save-btn' 的保存按钮
            // 如果没有，你需要修改 template.js 来添加它
            const saveButton = document.getElementById('save-btn'); 
            if (saveButton) {
                saveButton.addEventListener('click', function() {
                    console.log("正在保存NPC交友信息...");
                    // 模拟保存后跳转
                    window.location.href = '../app.html'; // 路径修正：从 friend-npc 目录返回到根目录的 app.html
                });
                console.log("保存按钮事件绑定成功！");
            } else {
                // 如果你的模板没有保存按钮，这个逻辑可以去掉
                console.warn("页面中未找到 ID 为 'save-btn' 的按钮，请检查 template.js。");
            }

            console.log("NPC交友页面加载和初始化完成。");
        });
    </script>
</body>
</html>
