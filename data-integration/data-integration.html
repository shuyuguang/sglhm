<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感应总机</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="data-integration.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <a href="../app.html" class="header-btn back-btn" title="返回">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1>感应总机</h1>
            <button class="header-btn menu-btn" title="更多选项"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </header>
        <main>
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-server"></i> 本地</h2>
                    <p class="card-description">管理存储在此设备上的数据</p>
                </div>
                <div class="button-group">
                    <button id="export-local-btn" class="card-btn"><i class="fa-solid fa-download"></i><span>导出本地数据</span></button>
                    <button id="import-local-btn" class="card-btn"><i class="fa-solid fa-upload"></i><span>导入本地数据</span></button>
                    <button id="clear-local-btn" class="card-btn danger"><i class="fa-solid fa-eraser"></i><span>清除本地数据</span></button>
                </div>
            </div>
            <div class="card disabled">
                <div class="card-header">
                    <h2><i class="fa-solid fa-cloud"></i> 云端</h2>
                    <p class="card-description">通过云服务同步和备份数据</p>
                </div>
                <div class="button-group">
                    <button class="card-btn" disabled title="功能暂未开放"><i class="fa-solid fa-cloud-arrow-down"></i><span>导出云端数据</span></button>
                    <button class="card-btn" disabled title="功能暂未开放"><i class="fa-solid fa-cloud-arrow-up"></i><span>导入云端数据</span></button>
                    <button class="card-btn danger" disabled title="功能暂未开放"><i class="fa-solid fa-eraser"></i><span>清除云端数据</span></button>
                </div>
            </div>
        </main>
    </div>
    <input type="file" id="import-file-input" accept=".json" style="display: none;">
    
    <!-- 依赖脚本 -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script> <!-- ★ 新增：引入 JSZip -->

    <!-- ▼▼▼ 修改点：加载所有模块的配置和总配置 ▼▼▼ -->
    <!-- 1. 加载各个模块的配置 -->
    <script src="../config/profile.config.js"></script>
    <script src="../config/chat.config.js"></script>
    <script src="../config/api.config.js"></script> <!-- 新增这一行 -->
    <!-- <script src="../config/diary.config.js"></script> -->

    <!-- 2. 加载聚合后的总配置 -->
    <script src="../config/app.config.js"></script>
    <!-- ▲▲▲ 修改结束 ▲▲▲ -->

    <script src="data-integration.js"></script>

</body>
</html>
