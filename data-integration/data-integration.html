<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="data-integration.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <a href="../app.html" class="header-btn back-btn" title="返回">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1>数据中心</h1>
            <button class="header-btn menu-btn" title="更多选项">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
        </header>

        <main>
            <!-- 本地数据卡片 -->
            <div class="card">
                <!-- ▼▼▼ 修改点：新增 header 包裹标题和描述 ▼▼▼ -->
                <div class="card-header">
                    <h2><i class="fa-solid fa-server"></i> 本地</h2>
                    <p class="card-description">管理存储在此设备上的数据</p>
                </div>
                <!-- ▲▲▲ 修改结束 ▲▲▲ -->
                <div class="button-group">
                    <button id="export-local-btn" class="card-btn">
                        <i class="fa-solid fa-download"></i>
                        <span>导出本地数据</span>
                    </button>
                    <button id="import-local-btn" class="card-btn">
                        <i class="fa-solid fa-upload"></i>
                        <span>导入本地数据</span>
                    </button>
                    <button id="clear-local-btn" class="card-btn danger">
                        <!-- ▼▼▼ 修改点：更换图标 ▼▼▼ -->
                        <i class="fa-solid fa-eraser"></i>
                        <!-- ▲▲▲ 修改结束 ▲▲▲ -->
                        <span>清除本地数据</span>
                    </button>
                </div>
            </div>

            <!-- 云端数据卡片 -->
            <div class="card disabled">
                 <!-- ▼▼▼ 修改点：新增 header 包裹标题和描述 ▼▼▼ -->
                <div class="card-header">
                    <h2><i class="fa-solid fa-cloud"></i> 云端</h2>
                    <p class="card-description">通过云服务同步和备份数据</p>
                </div>
                <!-- ▲▲▲ 修改结束 ▲▲▲ -->
                <div class="button-group">
                    <button class="card-btn" disabled title="功能暂未开放">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                        <span>导出云端数据</span>
                    </button>
                    <button class="card-btn" disabled title="功能暂未开放">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>导入云端数据</span>
                    </button>
                    <button class="card-btn danger" disabled title="功能暂未开放">
                        <i class="fa-solid fa-eraser"></i>
                        <span>清除云端数据</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 隐藏的文件输入框，用于导入 -->
    <input type="file" id="import-file-input" accept=".json" style="display: none;">

    <!-- 依赖脚本 -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="data-integration.js"></script>

</body>
</html>
