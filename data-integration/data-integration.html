<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感应总机</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="data-integration.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <a href="../app.html" class="header-btn back-btn" title="返回">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1>感应总机</h1>
            <button class="header-btn menu-btn" title="更多选项"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </header>
        <main>
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-server"></i> 本地</h2>
                    <p class="card-description">管理存在此设备的数据</p>
                </div>
                <div class="button-group-grid">
                    <button id="export-zip-btn" class="card-btn"><i class="fa-solid fa-file-zipper"></i><span>导出 ZIP</span></button>
                    <button id="export-json-btn" class="card-btn"><i class="fa-solid fa-file-code"></i><span>导出 JSON</span></button>
                    <button id="import-zip-btn" class="card-btn"><i class="fa-solid fa-upload"></i><span>导入 ZIP</span></button>
                    <button id="import-json-btn" class="card-btn"><i class="fa-solid fa-upload"></i><span>导入 JSON</span></button>
                    <button id="clear-local-btn" class="card-btn danger full-width"><i class="fa-solid fa-eraser"></i><span>清除本地数据</span></button>
                </div>
            </div>

            <!-- ▼▼▼ 修改点：更新云端卡片 ▼▼▼ -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-cloud"></i> 云端</h2>
                    <p class="card-description">通过云服务同步和备份</p>
                </div>
                <div class="button-group">
                    <!-- 提示：为未实现的功能添加 disabled 属性是好习惯 -->
                    <button id="export-cloud-btn" class="card-btn" disabled><i class="fa-solid fa-cloud-arrow-down"></i><span>导出云端数据</span></button>
                    <button id="import-cloud-btn" class="card-btn" disabled><i class="fa-solid fa-cloud-arrow-up"></i><span>导入云端数据</span></button>
                    <button id="clear-cloud-btn" class="card-btn danger" disabled><i class="fa-solid fa-trash-can"></i><span>清除云端数据</span></button>
                </div>
            </div>
            <!-- ▲▲▲ 修改结束 ▲▲▲ -->

        </main>
    </div>
    
    <input type="file" id="import-zip-input" accept=".zip" style="display: none;">
    <input type="file" id="import-json-input" accept=".json" style="display: none;">
    
    <!-- ... 依赖脚本和配置脚本不变 ... -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../config/profile.config.js"></script>
    <script src="../config/chat.config.js"></script>
    <script src="../config/api.config.js"></script>
    <script src="../config/app.config.js"></script>
    <script src="data-integration.js"></script>

</body>
</html>
