<head>

    <title>个性化</title>
    
    <!-- 引入公共资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">
    
    <!-- 引入此页面的专属样式 -->

<body>

    <!-- 页面内容生成脚本 -->

        document.addEventListener('DOMContentLoaded', () => {

            // 定义“个性化”页面的专属内容
            const personalityPageContent = `

                <nav class="tabs-nav">

                    </div>
                </nav>

                <!-- 【核心修改】用于显示小爱心的独立元素，放置在裁剪容器外部 -->
                <div class="active-tab-indicator"></div>

                <div class="main-container">
                    <main class="content-body">
                        <!-- Tab 内容面板 -->
                        <div class="tabs-content">
                            <div id="theme" class="tab-pane active">
                                <p>这里是【主题】的编辑区。</p>
                            </div>
                            <div id="bubbles" class="tab-pane">
                                <p>这里是【聊天气泡】的编辑区。</p>
                            </div>
                            <div id="pendant" class="tab-pane">
                                <p>这里是【头像挂件】的编辑区。</p>
                            </div>
                            <div id="font" class="tab-pane">
                                <p>这里是【字体】的编辑区。</p>
                            </div>
                        </div>
                    </main>
                </div>
            `;

            // 定义羽毛笔按钮的功能
            const handlePersonalityFeatherClick = () => {
                console.log('羽毛笔被点击，可以在这里执行保存个性化设置的逻辑。');
            };

            // 调用 createPageLayout 生成页面
            createPageLayout({
                title: '个性化',
                contentHtml: personalityPageContent,
                onFeatherClick: handlePersonalityFeatherClick
            });
        });
    </script>
</body>
</html>
