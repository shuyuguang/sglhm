<!-- relia-chat/chat-header.html -->

<!-- 顶部菜单遮罩 -->
<div class="header-menu-overlay" id="header-menu-overlay"></div>

<!-- 左侧内容面板 -->
<div class="header-panel" id="header-content-panel">
    <!-- 记忆 -->
    <div id="menu-content-memory" class="secondary-content-pane active">
        <div class="memory-switches-container">
            <div class="memory-switch-item">
                <div class="switch-text-content"><span class="switch-title">启用记忆</span><span class="switch-subtitle">AI可读取</span></div>
                <label class="switch-control"><input type="checkbox" id="enable-memory-switch" checked><span class="slider round"></span></label>
            </div>
            <div class="memory-switch-item">
                <div class="switch-text-content"><span class="switch-title">AI辅助记忆</span><span class="switch-subtitle">AI可编辑</span></div>
                <label class="switch-control"><input type="checkbox" id="ai-edit-memory-switch"><span class="slider round"></span></label>
            </div>
        </div>
        <div class="memory-management-header">
            <h4 class="memory-title">管理记忆</h4>
            <button class="add-memory-btn" id="add-memory-btn" title="添加记忆"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="memory-cards-container" id="memory-cards-container"></div>
    </div>
    <!-- 设定 -->
    <div id="menu-content-edit" class="secondary-content-pane">
        <div class="profile-group-container">
            <div class="profile-group">
                <h4 class="profile-group-title">用户设定</h4>
                <div class="profile-group-content" id="edit-user-profile-trigger">
                    <img src="" alt="用户头像" class="profile-edit-avatar" id="user-profile-edit-avatar">
                    <span class="profile-edit-name" id="user-profile-edit-name"></span>
                </div>
            </div>
            <div class="profile-group">
                <h4 class="profile-group-title">角色设定</h4>
                <div class="profile-group-content" id="edit-char-profile-trigger">
                    <img src="" alt="角色头像" class="profile-edit-avatar" id="char-profile-edit-avatar">
                    <span class="profile-edit-name" id="char-profile-edit-name"></span>
                </div>
            </div>
        </div>
    </div>
    <!-- ▼▼▼ 核心修改：风格面板已被删除 ▼▼▼ -->
    <!-- 模式 -->
    <div id="menu-content-model" class="secondary-content-pane">
        <div class="model-selection-group">
            <h4 class="panel-section-title">当前模型</h4>
            <button id="select-model-btn" class="send-action-btn model-select-btn"><span id="selected-model-name">选择模型</span></button>
        </div>
        <div class="mode-panel-item">
            <span class="mode-panel-item-title">是否开启DIY</span>
            <label class="switch-control"><input type="checkbox" id="enable-diy-switch"><span class="slider round"></span></label>
        </div>
        <div class="interaction-mode-group">
            <h4 class="panel-section-title">当前互动模式</h4>
            <button id="interaction-mode-capsule" class="interaction-mode-capsule"><span id="selected-interaction-mode-name"></span><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <!-- ▼▼▼ 核心修改：从风格面板移动过来的设置项 ▼▼▼ -->
        <div class="style-settings-wrapper">
            <div class="style-setting-group">
                <label>输出条数限制</label>
                <div class="min-max-input-container">
                    <input type="number" id="style-output-min" min="1" max="99"><span>-</span><input type="number" id="style-output-max" min="1" max="99">
                </div>
            </div>
            <div class="style-setting-group"><label for="style-visual-limit">视觉上下文限制</label><input type="number" id="style-visual-limit" min="30" max="99"></div>
            <div class="style-setting-group"><label for="style-memory-limit">记忆轮数限制</label><input type="number" id="style-memory-limit" min="10" max="99"></div>
        </div>
        <!-- ▲▲▲ 修改结束 ▲▲▲ -->
    </div>
    <!-- 表情 -->
    <div id="menu-content-emoji" class="secondary-content-pane">
        <div id="emoji-management-container"></div>
    </div>
    <!-- 灵感 -->
    <div id="menu-content-inspiration" class="secondary-content-pane">这里是灵感内容区</div>
    <!-- 指令 -->
    <div id="menu-content-prompt" class="secondary-content-pane">这里是指令内容区</div>
    <!-- 主题 -->
    <div id="menu-content-theme" class="secondary-content-pane">
        <div class="theme-section placeholder-section"><h4 class="panel-section-title">聊天气泡</h4></div>
        <div class="theme-section placeholder-section"><h4 class="panel-section-title">头像挂件</h4></div>
        <div class="theme-section">
            <div class="theme-section-header">
                <h4 class="panel-section-title">聊天背景</h4>
                <div class="theme-actions">
                    <button class="theme-action-btn" id="multi-select-bg-btn" title="多选"><i class="fa-solid fa-check-double"></i></button>
                    <button class="theme-action-btn" id="delete-selected-bg-btn" title="删除选中"><i class="fa-solid fa-trash-can"></i></button>
                    <button class="theme-action-btn" id="add-bg-from-url-btn" title="添加网络图片"><i class="fa-solid fa-link"></i></button>
                    <button class="theme-action-btn" id="add-bg-from-local-btn" title="上传本地图片"><i class="fa-solid fa-plus"></i></button>
                    <input type="file" id="bg-upload-input" accept="image/*" style="display: none;">
                </div>
            </div>
            <div class="bg-thumbnails-container" id="bg-thumbnails-container"></div>
        </div>
    </div>
</div>

<!-- 右侧选项卡面板 -->
<div class="header-panel" id="header-tabs-panel">
    <ul class="header-menu-list">
        <li class="header-menu-item"><a href="#" class="active" data-target="menu-content-memory"><span>记忆</span></a></li>
        <li class="header-menu-item"><a href="#" data-target="menu-content-edit"><span>设定</span></a></li>
        <!-- ▼▼▼ 核心修改：风格标签已被删除 ▼▼▼ -->
        <li class="header-menu-item"><a href="#" data-target="menu-content-model"><span>模式</span></a></li>
        <li class="header-menu-item"><a href="#" data-target="menu-content-emoji"><span>表情</span></a></li>
        <li class="header-menu-item"><a href="#" data-target="menu-content-inspiration"><span>灵感</span></a></li>
        <li class="header-menu-item"><a href="#" data-target="menu-content-prompt"><span>指令</span></a></li>
        <li class="header-menu-item"><a href="#" data-target="menu-content-theme"><span>主题</span></a></li>
    </ul>
</div>
