<!-- chat-room.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>聊天中</title>
    
    <!-- 引入公共资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    
    <!-- 引入本页面的专属 CSS -->
    <link rel="stylesheet" href="chat-room.css">
    <link rel="stylesheet" href="chat-header-menu.css">
    <link rel="stylesheet" href="chat-modals.css">
    <link rel="stylesheet" href="chat-components.css">
    <link rel="stylesheet" href="chat-input.css"> <!-- ▼▼▼ 新增：在这里引入输入框样式 ▼▼▼ -->

    <!-- 引入 profile 面板所需的全部 CSS -->
    <link rel="stylesheet" href="../profile/base.css">
    <link rel="stylesheet" href="../profile/components.css">
    <link rel="stylesheet" href="../profile/modals.css">
</head>
<body>
    <!-- 应用的主容器，JS会将聊天界面动态生成到这里 -->
    <div id="app-container">
        <!-- 聊天室UI将由JS动态生成到这里 -->
    </div>

    <!-- 顶部菜单 -->
    <div class="header-menu-overlay" id="header-menu-overlay"></div>
    
    <!-- 左侧内容面板 -->
    <div class="header-panel" id="header-content-panel">
        <div id="menu-content-memory" class="secondary-content-pane active">
            <div class="memory-switches-container">
                <div class="memory-switch-item">
                    <div class="switch-text-content">
                        <span class="switch-title">启用记忆</span>
                        <span class="switch-subtitle">AI可读取</span>
                    </div>
                    <label class="switch-control">
                        <input type="checkbox" id="enable-memory-switch" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="memory-switch-item">
                    <div class="switch-text-content">
                        <span class="switch-title">AI辅助记忆</span>
                        <span class="switch-subtitle">AI可编辑</span>
                    </div>
                    <label class="switch-control">
                        <input type="checkbox" id="ai-edit-memory-switch">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            <div class="memory-management-header">
                <h4 class="memory-title">管理记忆</h4>
                <button class="add-memory-btn" id="add-memory-btn" title="添加记忆"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="memory-cards-container" id="memory-cards-container">
                <!-- 记忆卡片将由 JS 动态生成到这里 -->
            </div>
        </div>
        <div id="menu-content-edit" class="secondary-content-pane">
            <div class="profile-group-container">
                <!-- 用户设定分区 -->
                <div class="profile-group">
                    <h4 class="profile-group-title">用户设定</h4>
                    <div class="profile-group-content" id="edit-user-profile-trigger">
                        <img src="" alt="用户头像" class="profile-edit-avatar" id="user-profile-edit-avatar">
                        <span class="profile-edit-name" id="user-profile-edit-name"></span>
                    </div>
                </div>
                <!-- 角色设定分区 -->
                <div class="profile-group">
                    <h4 class="profile-group-title">角色设定</h4>
                    <div class="profile-group-content" id="edit-char-profile-trigger">
                        <img src="" alt="角色头像" class="profile-edit-avatar" id="char-profile-edit-avatar">
                        <span class="profile-edit-name" id="char-profile-edit-name"></span>
                    </div>
                </div>
            </div>
        </div>
        <!-- ▼▼▼ 修改：更新风格内容区 ▼▼▼ -->
        <div id="menu-content-style" class="secondary-content-pane">
            <div class="style-settings-wrapper">
                <div class="style-setting-group">
                    <label>输出条数限制</label>
                    <div class="min-max-input-container">
                        <input type="number" id="style-output-min" min="1" max="99">
                        <span>-</span>
                        <input type="number" id="style-output-max" min="1" max="99">
                    </div>
                </div>
                <div class="style-setting-group">
                    <label for="style-visual-limit">视觉上下文限制</label>
                    <input type="number" id="style-visual-limit" min="30" max="99">
                </div>
                <div class="style-setting-group">
                    <label for="style-memory-limit">记忆轮数限制</label>
                    <input type="number" id="style-memory-limit" min="10" max="99">
                </div>
            </div>
        </div>
        <!-- ▲▲▲ 修改结束 ▲▲▲ -->
        <div id="menu-content-model" class="secondary-content-pane">
            <div class="model-selection-group">
                <h4 class="panel-section-title">当前模型</h4>
                <button id="select-model-btn" class="send-action-btn model-select-btn">
                    <span id="selected-model-name">选择模型</span>
                </button>
            </div>
            <div class="mode-panel-item">
                <span class="mode-panel-item-title">是否开启DIY</span>
                <label class="switch-control">
                    <input type="checkbox" id="enable-diy-switch">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="interaction-mode-group">
                <h4 class="panel-section-title">当前互动模式</h4>
                <button id="interaction-mode-capsule" class="interaction-mode-capsule">
                    <span id="selected-interaction-mode-name"></span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div id="menu-content-emoji" class="secondary-content-pane">这里是表情内容区</div>
        <div id="menu-content-inspiration" class="secondary-content-pane">这里是灵感内容区</div>
        <div id="menu-content-prompt" class="secondary-content-pane">这里是指令内容区</div>
        <div id="menu-content-theme" class="secondary-content-pane">
            <div class="theme-section placeholder-section">
                <h4 class="panel-section-title">聊天气泡</h4>
            </div>
            <div class="theme-section placeholder-section">
                <h4 class="panel-section-title">头像挂件</h4>
            </div>
            <div class="theme-section">
                <div class="theme-section-header">
                    <h4 class="panel-section-title">聊天背景</h4>
                    <div class="theme-actions">
                        <button class="theme-action-btn" id="multi-select-bg-btn" title="多选"><i class="fa-solid fa-check-double"></i></button>
                        <button class="theme-action-btn" id="delete-selected-bg-btn" title="删除选中"><i class="fa-solid fa-trash-can"></i></button>
                        <button class="theme-action-btn" id="add-bg-from-url-btn" title="添加网络图片"><i class="fa-solid fa-link"></i></button>
                        <button class="theme-action-btn" id="add-bg-from-local-btn" title="上传本地图片"><i class="fa-solid fa-plus"></i></button>
                        <input type="file" id="bg-upload-input" accept="image/*" style="display: none;">
                    </div>
                </div>
                <div class="bg-thumbnails-container" id="bg-thumbnails-container">
                    <!-- 背景缩略图将由 JS 动态生成到这里 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧选项卡面板 -->
    <div class="header-panel" id="header-tabs-panel">
        <ul class="header-menu-list">
            <li class="header-menu-item"><a href="#" class="active" data-target="menu-content-memory"><span>记忆</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-edit"><span>设定</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-style"><span>风格</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-model"><span>模式</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-emoji"><span>表情</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-inspiration"><span>灵感</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-prompt"><span>指令</span></a></li>
            <li class="header-menu-item"><a href="#" data-target="menu-content-theme"><span>主题</span></a></li>
        </ul>
    </div>

    <!-- 模型选择模态框 -->
    <div class="modal-overlay" id="model-selector-overlay">
        <div class="modal-panel model-selector-panel">
            <div class="modal-header">
                <h3 class="modal-title">选择牵引仪模型</h3>
                <button class="modal-close" id="close-model-selector-btn" title="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="model-list-container" id="model-list-container"></div>
            </div>
        </div>
    </div>
    
    <!-- 记忆编辑器模态框 -->
    <div class="modal-overlay" id="memory-editor-overlay">
        <div class="modal-panel memory-editor-panel">
            <div class="modal-header">
                <h3 class="modal-title" id="memory-editor-title">管理记忆</h3>
                <button class="modal-close" id="memory-editor-close-btn" title="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="memory-editor-textarea" placeholder="在此输入记忆内容..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="modal-btn-delete" id="memory-editor-delete-btn">删除</button>
                <button class="modal-btn-cancel" id="memory-editor-cancel-btn">取消</button>
                <button class="modal-btn-confirm" id="memory-editor-confirm-btn">确认</button>
            </div>
        </div>
    </div>
    
    <!-- 互动模式选择的底部操作表 -->
    <div class="bottom-sheet-overlay" id="interaction-mode-sheet-overlay">
        <div class="bottom-sheet">
            <ul class="bottom-sheet-actions" id="interaction-mode-list">
                <li><button class="action-button" data-style="short-chat">短聊体</button></li>
                <li><button class="action-button" data-style="dialogue">对话体</button></li>
                <li><button class="action-button" data-style="novel">小说体</button></li>
                <li><button class="action-button" data-style="text-adventure">文游体</button></li>
            </ul>
            <button class="bottom-sheet-cancel" id="interaction-mode-cancel-btn">取消</button>
        </div>
    </div>

    <!-- 背景URL输入框 -->
    <div class="prompt-overlay" id="bg-url-prompt-overlay">
        <div class="prompt-box">
            <h4>添加图片URL作为背景</h4>
            <input type="text" id="bg-url-input" placeholder="https://example.com/image.png">
            <div class="prompt-actions">
                <button id="cancel-bg-url-btn" class="prompt-btn">取消</button>
                <button id="confirm-bg-url-btn" class="prompt-btn">确认</button>
            </div>
        </div>
    </div>

    <!-- ==================== 角色编辑面板 (Character Editor) ==================== -->
    <div class="modal-overlay" id="edit-modal-overlay">
        <div class="modal-panel">
            <div class="modal-header">
                <h3 class="modal-title">编辑角色档案</h3>
                <div class="modal-header-actions">
                    <button class="btn-help" id="help-btn" title="帮助"><i class="fa-solid fa-question"></i></button>
                    <button class="modal-close" id="close-modal-btn" title="关闭">&times;</button>
                    <button class="btn-save" id="save-btn" title="保存"><i class="fa-solid fa-check"></i></button>
                </div>
            </div>
            <div id="help-tooltip" class="help-tooltip"><p>在这里修改的设定将实时同步。</p></div>
            <div class="modal-body">
                <div class="modal-sidebar">
                    <div class="sidebar-nav-list">
                        <button class="modal-nav-button fixed-nav-button active" data-target="modal-section-visuals"><span>头像背景</span></button>
                        <button class="modal-nav-button fixed-nav-button" data-target="modal-section-basic-info"><span>基础信息</span></button>
                        <button class="modal-nav-button fixed-nav-button" data-target="modal-section-relationship"><span>关系范围</span></button>
                    </div>
                    <button class="add-section-btn" id="add-section-btn"><i class="fa-solid fa-plus"></i><span>添加栏目</span></button>
                </div>
                <div class="modal-main-content">
                    <div id="modal-section-visuals" class="modal-section-pane active">
                        <div class="visual-edit-item">
                            <div class="form-row"><label for="edit-avatar-url">头像</label><input type="text" id="edit-avatar-url" placeholder="输入图片 URL 或点击下方图片上传"></div>
                            <div class="visual-preview-container"><div class="visual-preview-wrapper avatar-wrapper"><img src="" alt="Avatar Preview" id="avatar-preview-img" class="visual-preview"></div><div class="edit-icon-overlay"><i class="fa-solid fa-pencil"></i></div></div>
                            <input type="file" id="avatar-upload-input" accept="image/*" style="display: none;">
                        </div>
                        <div class="visual-edit-item">
                            <div class="form-row"><label for="edit-banner-url">背景</label><input type="text" id="edit-banner-url" placeholder="输入图片 URL 或点击下方图片上传"></div>
                            <div class="visual-preview-container"><div class="visual-preview-wrapper banner-wrapper"><img src="" alt="Banner Preview" id="banner-preview-img" class="visual-preview"></div><div class="edit-icon-overlay"><i class="fa-solid fa-pencil"></i></div></div>
                            <input type="file" id="banner-upload-input" accept="image/*" style="display: none;">
                        </div>
                    </div>
                    <div id="modal-section-basic-info" class="modal-section-pane">
                        <div class="form-group"><label for="edit-username">角色名</label><input type="text" id="edit-username" placeholder="名称限1-10字符" maxlength="10"></div>
                        <div class="form-group"><label>性别</label><div class="form-group-clickable" id="edit-gender-trigger"><span class="value-display"></span><i class="fa-solid fa-arrows-rotate"></i></div></div>
                        <div class="form-group"><label>年龄</label><div class="form-group-clickable" id="edit-age-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                        <div class="form-group"><label>种族</label><div class="form-group-clickable" id="edit-race-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                        <div class="form-group"><label>职业</label><div class="form-group-clickable" id="edit-occupation-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                        <div class="form-group"><label>简介</label><div class="form-group-clickable" id="edit-bio-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                    </div>
                    <div id="modal-section-relationship" class="modal-section-pane"></div>
                </div>
            </div>
            <div class="sub-editor-panel" id="sub-editor-panel"><div class="sep-header"><button class="sep-btn" id="sep-back-btn"><i class="fa-solid fa-chevron-left"></i></button><h3 class="sep-title" id="sep-title">编辑</h3><button class="sep-btn sep-btn-save" id="sep-save-btn"><i class="fa-solid fa-check"></i></button></div><div class="sep-body"><textarea id="sep-textarea"></textarea></div></div>
            <div class="sub-editor-panel" id="item-editor-panel"><div class="sep-header"><button class="sep-btn" id="item-editor-back-btn"><i class="fa-solid fa-chevron-left"></i></button><h3 class="sep-title" id="item-editor-title-header">编辑条目</h3><button class="sep-btn sep-btn-save" id="item-editor-save-btn"><i class="fa-solid fa-check"></i></button></div><div class="sep-body iep-body"><input type="text" id="item-editor-title-input" placeholder="在此填入标题" maxlength="10"><textarea id="item-editor-value-textarea"></textarea></div></div>
        </div>
    </div>
    <div class="prompt-overlay" id="name-prompt-overlay"><div class="prompt-box"><h4>为新栏目命名</h4><input type="text" id="new-section-name-input" placeholder="请输入 2-4 个字符" maxlength="4"><div class="prompt-actions"><button id="cancel-prompt-btn" class="prompt-btn">取消</button><button id="confirm-prompt-btn" class="prompt-btn">确认</button></div></div></div>
    <div class="bottom-sheet-overlay" id="custom-section-options-overlay"><div class="bottom-sheet"><ul class="bottom-sheet-actions"><li><button class="action-button" data-action="rename">编辑栏目名称</button></li><li><button class="action-button action-delete" data-action="delete">删除此栏目</button></li></ul><button class="bottom-sheet-cancel" id="cancel-options-sheet-btn">取消</button></div></div>
    <div class="bottom-sheet-overlay" id="add-section-sheet-overlay"><div class="bottom-sheet"><div class="preset-tags-container" id="preset-tags-container"><button class="preset-tag preset-tag-custom" data-action="custom"><i class="fa-solid fa-plus"></i><span>自定义栏目</span></button></div><button class="bottom-sheet-cancel" id="cancel-add-sheet-btn">取消</button></div></div>
    <div class="cropper-overlay" id="cropper-overlay"><div class="cropper-container"><div class="cropper-image-container"><img id="cropper-image" src=""></div><div class="cropper-actions"><button id="cancel-crop-btn" class="prompt-btn">取消</button><button id="confirm-crop-btn" class="prompt-btn">确认</button></div></div></div>
    
    <!-- ==================== 用户编辑面板 (User Editor) ==================== -->
    <div class="modal-overlay" id="user-edit-modal-overlay">
        <div class="modal-panel">
            <div class="modal-header">
                <h3 class="modal-title">编辑用户档案</h3>
                <div class="modal-header-actions">
                    <button class="btn-help" id="user-help-btn" title="帮助"><i class="fa-solid fa-question"></i></button>
                    <button class="modal-close" id="user-close-modal-btn" title="关闭">&times;</button>
                    <button class="btn-save" id="user-save-btn" title="保存"><i class="fa-solid fa-check"></i></button>
                </div>
            </div>
            <div id="user-help-tooltip" class="help-tooltip"><p>在这里修改的用户设定将同步到所有聊天中。</p></div>
            <div class="modal-body">
                <div class="modal-sidebar">
                    <div class="sidebar-nav-list">
                        <button class="modal-nav-button fixed-nav-button active" data-target="user-modal-section-visuals"><span>头像背景</span></button>
                        <button class="modal-nav-button fixed-nav-button" data-target="user-modal-section-basic-info"><span>基础信息</span></button>
                        <button class="modal-nav-button fixed-nav-button" data-target="user-modal-section-relationship"><span>关系范围</span></button>
                    </div>
                    <button class="add-section-btn" id="user-add-section-btn"><i class="fa-solid fa-plus"></i><span>添加栏目</span></button>
                </div>
                <div class="modal-main-content">
                    <div id="user-modal-section-visuals" class="modal-section-pane active">
                        <div class="visual-edit-item">
                            <div class="form-row"><label for="user-edit-avatar-url">头像</label><input type="text" id="user-edit-avatar-url" placeholder="输入图片 URL 或点击下方图片上传"></div>
                            <div class="visual-preview-container"><div class="visual-preview-wrapper avatar-wrapper"><img src="" alt="Avatar Preview" id="user-avatar-preview-img" class="visual-preview"></div><div class="edit-icon-overlay"><i class="fa-solid fa-pencil"></i></div></div>
                            <input type="file" id="user-avatar-upload-input" accept="image/*" style="display: none;">
                        </div>
                        <div class="visual-edit-item">
                            <div class="form-row"><label for="user-edit-banner-url">背景</label><input type="text" id="user-edit-banner-url" placeholder="输入图片 URL 或点击下方图片上传"></div>
                            <div class="visual-preview-container"><div class="visual-preview-wrapper banner-wrapper"><img src="" alt="Banner Preview" id="user-banner-preview-img" class="visual-preview"></div><div class="edit-icon-overlay"><i class="fa-solid fa-pencil"></i></div></div>
                            <input type="file" id="user-banner-upload-input" accept="image/*" style="display: none;">
                        </div>
                    </div>
                    <div id="user-modal-section-basic-info" class="modal-section-pane">
                        <div class="form-group"><label for="user-edit-username">用户名</label><input type="text" id="user-edit-username" placeholder="名称限1-10字符" maxlength="10"></div>
                        <div class="form-group"><label>性别</label><div class="form-group-clickable" id="user-edit-gender-trigger"><span class="value-display"></span><i class="fa-solid fa-lock"></i></div></div>
                        <div class="form-group"><label>年龄</label><div class="form-group-clickable" id="user-edit-age-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                        <div class="form-group"><label>种族</label><div class="form-group-clickable" id="user-edit-race-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                        <div class="form-group"><label>职业</label><div class="form-group-clickable" id="user-edit-occupation-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                        <div class="form-group"><label>简介</label><div class="form-group-clickable" id="user-edit-bio-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                    </div>
                    <div id="user-modal-section-relationship" class="modal-section-pane"></div>
                </div>
            </div>
            <div class="sub-editor-panel" id="user-sub-editor-panel"><div class="sep-header"><button class="sep-btn" id="user-sep-back-btn"><i class="fa-solid fa-chevron-left"></i></button><h3 class="sep-title" id="user-sep-title">编辑</h3><button class="sep-btn sep-btn-save" id="user-sep-save-btn"><i class="fa-solid fa-check"></i></button></div><div class="sep-body"><textarea id="user-sep-textarea"></textarea></div></div>
            <div class="sub-editor-panel" id="user-item-editor-panel"><div class="sep-header"><button class="sep-btn" id="user-item-editor-back-btn"><i class="fa-solid fa-chevron-left"></i></button><h3 class="sep-title" id="user-item-editor-title-header">编辑条目</h3><button class="sep-btn sep-btn-save" id="user-item-editor-save-btn"><i class="fa-solid fa-check"></i></button></div><div class="sep-body iep-body"><input type="text" id="user-item-editor-title-input" placeholder="在此填入标题" maxlength="10"><textarea id="user-item-editor-value-textarea"></textarea></div></div>
        </div>
    </div>
    <div class="prompt-overlay" id="user-name-prompt-overlay"><div class="prompt-box"><h4>为新栏目命名</h4><input type="text" id="user-new-section-name-input" placeholder="请输入 2-4 个字符" maxlength="4"><div class="prompt-actions"><button id="user-cancel-prompt-btn" class="prompt-btn">取消</button><button id="user-confirm-prompt-btn" class="prompt-btn">确认</button></div></div></div>
    <div class="bottom-sheet-overlay" id="user-custom-section-options-overlay"><div class="bottom-sheet"><ul class="bottom-sheet-actions"><li><button class="action-button" data-action="rename">编辑栏目名称</button></li><li><button class="action-button action-delete" data-action="delete">删除此栏目</button></li></ul><button class="bottom-sheet-cancel" id="user-cancel-options-sheet-btn">取消</button></div></div>
