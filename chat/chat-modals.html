<!-- relia-chat/chat-modals.html -->

<!-- 模型选择模态框 -->
<div class="modal-overlay" id="model-selector-overlay">
    <div class="modal-panel model-selector-panel">
        <div class="modal-header"><h3 class="modal-title">选择牵引仪模型</h3><button class="modal-close" id="close-model-selector-btn" title="关闭">&times;</button></div>
        <div class="modal-body"><div class="model-list-container" id="model-list-container"></div></div>
    </div>
</div>

<!-- 记忆编辑器模态框 -->
<div class="modal-overlay" id="memory-editor-overlay">
    <div class="modal-panel memory-editor-panel">
        <div class="modal-header"><h3 class="modal-title" id="memory-editor-title">管理记忆</h3><button class="modal-close" id="memory-editor-close-btn" title="关闭">&times;</button></div>
        <div class="modal-body"><textarea id="memory-editor-textarea" placeholder="在此输入记忆内容..."></textarea></div>
        <div class="modal-footer">
            <button class="modal-btn-delete" id="memory-editor-delete-btn">删除</button>
            <button class="modal-btn-cancel" id="memory-editor-cancel-btn">取消</button>
            <button class="modal-btn-confirm" id="memory-editor-confirm-btn">确认</button>
        </div>
    </div>
</div>

<!-- 互动模式选择的底部操作表 -->
<div class="bottom-sheet-overlay" id="interaction-mode-sheet-overlay">
    <div class="bottom-sheet">
        <ul class="bottom-sheet-actions" id="interaction-mode-list">
            <li><button class="action-button" data-style="short-chat">短聊体</button></li>
            <li><button class="action-button" data-style="dialogue">对话体</button></li>
            <li><button class="action-button" data-style="novel">小说体</button></li>
            <li><button class="action-button" data-style="text-adventure">文游体</button></li>
        </ul>
        <button class="bottom-sheet-cancel" id="interaction-mode-cancel-btn">取消</button>
    </div>
</div>

<!-- 背景URL输入框 -->
<div class="prompt-overlay" id="bg-url-prompt-overlay">
    <div class="prompt-box">
        <h4>添加图片URL作为背景</h4>
        <input type="text" id="bg-url-input" placeholder="https://example.com/image.png">
        <div class="prompt-actions">
            <button id="cancel-bg-url-btn" class="prompt-btn">取消</button>
            <button id="confirm-bg-url-btn" class="prompt-btn">确认</button>
        </div>
    </div>
</div>

<!-- 添加网络表情模态框 -->
<div class="modal-overlay" id="web-emoji-modal">
    <div class="modal-panel web-emoji-panel">
        <div class="modal-header"><h3 class="modal-title">批量添加网络表情</h3></div>
        <div class="modal-body">
            <p class="modal-description">请按 <strong>链接+名称</strong> 的格式粘贴，每行一个。</p>
            <textarea id="web-emoji-url-input" placeholder="例如:&#10;https://.../cat.png 猫猫&#10;https://.../dog.gif 狗狗"></textarea>
        </div>
        <div class="modal-footer">
            <button class="modal-btn-cancel" id="cancel-web-emoji-btn">取消</button>
            <button class="modal-btn-confirm" id="confirm-web-emoji-btn">确认</button>
        </div>
    </div>
</div>

<!-- 隐藏的文件上传输入框 (表情包) -->
<input type="file" id="emoji-upload-input" accept="image/*,image/gif" multiple style="display: none;">

<!-- 消息操作菜单 -->
<div class="message-menu-overlay" id="message-menu-overlay">
    <div class="message-menu" id="message-menu"></div>
</div>
<!-- ▼▼▼ 新增：图片发送面板 ▼▼▼ -->
<div class="modal-overlay" id="image-sender-overlay">
    <div class="modal-panel image-sender-panel">
        <div class="modal-header">
            <h3 class="modal-title">发送图片</h3>
            <button class="modal-close" id="close-image-sender-btn" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="image-sender-tabs">
                <button class="image-sender-tab active" data-target="text-photo">文字图</button>
                <button class="image-sender-tab" data-target="url-photo">链接图</button>
                <button class="image-sender-tab" data-target="local-photo">本地图</button>
            </div>
            <div class="image-sender-content">
                <div id="text-photo" class="image-sender-pane active">
                    <input type="text" id="text-photo-input" placeholder="输入你想生成的图片文字...">
                </div>
                <div id="url-photo" class="image-sender-pane">
                    <input type="url" id="url-photo-input" placeholder="粘贴图片链接...">
                </div>
                <div id="local-photo" class="image-sender-pane">
                    <button id="local-photo-btn" class="modal-btn-confirm">选择本地图片</button>
                    <input type="file" id="local-photo-upload" accept="image/*" style="display: none;">
                </div>
            </div>
            <div class="image-preview-area">
                <div id="image-preview-container">
                    <div id="image-preview-placeholder"><i class="fa-regular fa-image"></i><span>图片预览</span></div>
                    <img id="image-preview-img" src="" alt="预览">
                    <div class="loading-overlay"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn-confirm" id="send-image-btn" disabled>发送</button>
        </div>
    </div>
</div>
<!-- ▲▲▲ 新增结束 ▲▲▲ -->
