<!-- relia-chat/chat-modals.html -->

<!-- 模型选择模态框 -->
<div class="modal-overlay" id="model-selector-overlay">
    <div class="modal-panel model-selector-panel">
        <div class="modal-header"><h3 class="modal-title">选择牵引仪模型</h3><button class="modal-close" id="close-model-selector-btn" title="关闭">&times;</button></div>
        <div class="modal-body"><div class="model-list-container" id="model-list-container"></div></div>
    </div>
</div>

<!-- 记忆编辑器模态框 -->
<div class="modal-overlay" id="memory-editor-overlay">
    <div class="modal-panel memory-editor-panel">
        <div class="modal-header"><h3 class="modal-title" id="memory-editor-title">管理记忆</h3><button class="modal-close" id="memory-editor-close-btn" title="关闭">&times;</button></div>
        <div class="modal-body"><textarea id="memory-editor-textarea" placeholder="在此输入记忆内容..."></textarea></div>
        <div class="modal-footer">
            <button class="modal-btn-delete" id="memory-editor-delete-btn">删除</button>
            <button class="modal-btn-cancel" id="memory-editor-cancel-btn">取消</button>
            <button class="modal-btn-confirm" id="memory-editor-confirm-btn">确认</button>
        </div>
    </div>
</div>

<!-- 互动模式选择的底部操作表 -->
<div class="bottom-sheet-overlay" id="interaction-mode-sheet-overlay">
    <div class="bottom-sheet">
        <ul class="bottom-sheet-actions" id="interaction-mode-list">
            <li><button class="action-button" data-style="short-chat">短聊体</button></li>
            <li><button class="action-button" data-style="dialogue">对话体</button></li>
            <li><button class="action-button" data-style="novel">小说体</button></li>
            <li><button class="action-button" data-style="text-adventure">文游体</button></li>
        </ul>
        <button class="bottom-sheet-cancel" id="interaction-mode-cancel-btn">取消</button>
    </div>
</div>

<!-- 背景URL输入框 -->
<div class="prompt-overlay" id="bg-url-prompt-overlay">
    <div class="prompt-box">
        <h4>添加图片URL作为背景</h4>
        <input type="text" id="bg-url-input" placeholder="https://example.com/image.png">
        <div class="prompt-actions">
            <button id="cancel-bg-url-btn" class="prompt-btn">取消</button>
            <button id="confirm-bg-url-btn" class="prompt-btn">确认</button>
        </div>
    </div>
</div>

<!-- 添加网络表情模态框 -->
<div class="modal-overlay" id="web-emoji-modal">
    <div class="modal-panel web-emoji-panel">
        <div class="modal-header"><h3 class="modal-title">批量添加网络表情</h3></div>
        <div class="modal-body">
            <p class="modal-description">请按 <strong>链接+名称</strong> 的格式粘贴，每行一个。</p>
            <textarea id="web-emoji-url-input" placeholder="例如:&#10;https://.../cat.png 猫猫&#10;https://.../dog.gif 狗狗"></textarea>
        </div>
        <div class="modal-footer">
            <button class="modal-btn-cancel" id="cancel-web-emoji-btn">取消</button>
            <button class="modal-btn-confirm" id="confirm-web-emoji-btn">确认</button>
        </div>
    </div>
</div>

<!-- 隐藏的文件上传输入框 (表情包) -->
<input type="file" id="emoji-upload-input" accept="image/*,image/gif" multiple style="display: none;">

<!-- 消息操作菜单 -->
<div class="message-menu-overlay" id="message-menu-overlay">
    <div class="message-menu" id="message-menu"></div>
</div>
<!-- ▼▼▼ 核心重构：图片发送面板 ▼▼▼ -->
<div class="modal-overlay" id="image-sender-overlay">
    <div class="modal-panel image-sender-panel">
        <div class="modal-header">
            <h3 class="modal-title">发送图片</h3>
            <button class="modal-close" id="close-image-sender-btn" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <!-- 新的输入区域 -->
            <div class="image-input-area">
                <div class="input-area-header">
                    <label for="multi-purpose-image-input">输入文本或链接</label>
                    <button class="help-icon-btn" id="image-sender-help-btn" title="帮助"><i class="fa-solid fa-question-circle"></i></button>
                </div>
                <textarea id="multi-purpose-image-input" rows="3" placeholder="在这里输入..."></textarea>
                <div class="input-help-tooltip" id="image-sender-help-tooltip">
                    <p>文字图请输入文本并点击“+文字图”，链接图请输入单个图片链接并点击“+链接图”，上传本地图片请点击“+本地图”，文字图可多个，链接图/本地图不宜多</p>
                </div>
            </div>
            
            <!-- 添加按钮 -->
            <div class="add-buttons-container">
                <button class="add-btn" id="add-text-photo-btn" title="添加文字图"><i class="fa-solid fa-plus"></i> 文字图</button>
                <button class="add-btn" id="add-url-photo-btn" title="添加链接图"><i class="fa-solid fa-plus"></i> 链接图</button>
                <button class="add-btn" id="add-local-photo-btn" title="添加本地图"><i class="fa-solid fa-plus"></i> 本地图</button>
                <!-- ▼▼▼ 核心修改：发送按钮移动到此处 ▼▼▼ -->
                <button class="modal-btn-confirm" id="send-image-btn" disabled title="发送"><i class="fa-solid fa-location-arrow"></i></button>
                <!-- ▲▲▲ 修改结束 ▲▲▲ -->
                <input type="file" id="local-photo-upload" accept="image/*" style="display: none;">
            </div>

            <!-- 多图预览区域 -->
            <div class="image-multi-preview-area">
                <div id="image-multi-preview-container">
                    <!-- 预览缩略图将动态添加到这里 -->
                </div>
                 <div id="image-multi-preview-placeholder">
                    <i class="fa-regular fa-images"></i>
                    <span>待发送的图片将在这里预览</span>
                </div>
            </div>
        </div>
        <!-- ▼▼▼ 核心修改：移除了原来的底部发送按钮 ▼▼▼ -->
    </div>
</div>
<!-- ▲▲▲ 重构结束 ▲▲▲ -->

<!-- ▼▼▼ 新增：文字图预览模态框 ▼▼▼ -->
<div class="modal-overlay simple-text-overlay" id="text-preview-overlay">
    <div class="text-preview-content"></div>
</div>
<!-- ▲▲▲ 新增结束 ▲▲▲ -->

<!-- ▼▼▼ 新增：发送链接模态框 ▼▼▼ -->
<div class="modal-overlay" id="link-sender-overlay">
    <div class="modal-panel link-sender-panel">
        <div class="modal-header">
            <h3 class="modal-title">发送链接</h3>
            <button class="modal-close" id="close-link-sender-btn" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="link-title-input">标题</label>
                <input type="text" id="link-title-input" placeholder="输入链接标题">
            </div>
            <div class="form-group">
                <label for="link-body-input">正文</label>
                <textarea id="link-body-input" rows="3" placeholder="输入链接正文内容"></textarea>
            </div>
            <div class="form-group">
                <label for="link-source-input">来源</label>
                <input type="text" id="link-source-input" placeholder="（选填）输入来源，如网站名">
            </div>
            
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="link-add-image-checkbox">
                    <span>配图</span>
                </label>
            </div>

            <div class="link-image-section" id="link-image-section">
                <div class="link-image-preview" id="link-image-preview">
                    <!-- 图片预览将显示在这里 -->
                    <div class="placeholder">
                        <i class="fa-regular fa-image"></i>
                        <span>选择一张图片</span>
                    </div>
                </div>
                <div class="link-image-controls">
                    <input type="text" id="link-image-input" placeholder="输入文本或图片URL">
                    <div class="image-add-buttons">
                        <button class="add-btn small" id="add-link-text-photo-btn" title="添加文字图"><i class="fa-solid fa-font"></i></button>
                        <button class="add-btn small" id="add-link-url-photo-btn" title="添加链接图"><i class="fa-solid fa-link"></i></button>
                        <button class="add-btn small" id="add-link-local-photo-btn" title="添加本地图"><i class="fa-solid fa-upload"></i></button>
                        <input type="file" id="link-local-photo-upload" accept="image/*" style="display: none;">
                    </div>
                </div>
            </div>

        </div>
        <div class="modal-footer">
            <button class="modal-btn-cancel" id="cancel-link-send-btn">取消</button>
            <button class="modal-btn-confirm" id="confirm-link-send-btn" disabled>发送</button>
        </div>
    </div>
</div>
<!-- ▲▲▲ 新增结束 ▲▲▲ -->
