<!-- achat/chat-editor-panels.html -->

<!-- ==================== 角色编辑面板 (Character Editor) ==================== -->
<div class="modal-overlay" id="edit-modal-overlay">
    <div class="modal-panel">
        <div class="modal-header">
            <h3 class="modal-title">编辑角色档案</h3>
            <div class="modal-header-actions">
                <button class="btn-help" id="help-btn" title="帮助"><i class="fa-solid fa-question"></i></button>
                <button class="modal-close" id="close-modal-btn" title="关闭">&times;</button>
                <button class="btn-save" id="save-btn" title="保存"><i class="fa-solid fa-check"></i></button>
            </div>
        </div>
        <div id="help-tooltip" class="help-tooltip"><p>在这里修改的设定将实时同步。</p></div>
        <div class="modal-body">
            <div class="modal-sidebar">
                <div class="sidebar-nav-list">
                    <button class="modal-nav-button fixed-nav-button active" data-target="modal-section-visuals"><span>头像背景</span></button>
                    <button class="modal-nav-button fixed-nav-button" data-target="modal-section-basic-info"><span>基础信息</span></button>
                    <button class="modal-nav-button fixed-nav-button" data-target="modal-section-relationship"><span>关系范围</span></button>
                </div>
                <button class="add-section-btn" id="add-section-btn"><i class="fa-solid fa-plus"></i><span>添加栏目</span></button>
            </div>
            <div class="modal-main-content">
                <div id="modal-section-visuals" class="modal-section-pane active">
                    <div class="visual-edit-item">
                        <div class="form-row"><label for="edit-avatar-url">头像</label><input type="text" id="edit-avatar-url" placeholder="输入图片 URL 或点击下方图片上传"></div>
                        <div class="visual-preview-container"><div class="visual-preview-wrapper avatar-wrapper"><img src="" alt="Avatar Preview" id="avatar-preview-img" class="visual-preview"></div><div class="edit-icon-overlay"><i class="fa-solid fa-pencil"></i></div></div>
                        <input type="file" id="avatar-upload-input" accept="image/*" style="display: none;">
                    </div>
                    <div class="visual-edit-item">
                        <div class="form-row"><label for="edit-banner-url">背景</label><input type="text" id="edit-banner-url" placeholder="输入图片 URL 或点击下方图片上传"></div>
                        <div class="visual-preview-container"><div class="visual-preview-wrapper banner-wrapper"><img src="" alt="Banner Preview" id="banner-preview-img" class="visual-preview"></div><div class="edit-icon-overlay"><i class="fa-solid fa-pencil"></i></div></div>
                        <input type="file" id="banner-upload-input" accept="image/*" style="display: none;">
                    </div>
                </div>
                <div id="modal-section-basic-info" class="modal-section-pane">
                    <div class="form-group"><label for="edit-username">角色名</label><input type="text" id="edit-username" placeholder="名称限1-10字符" maxlength="10"></div>
                    <div class="form-group"><label>性别</label><div class="form-group-clickable" id="edit-gender-trigger"><span class="value-display"></span><i class="fa-solid fa-arrows-rotate"></i></div></div>
                    <div class="form-group"><label>年龄</label><div class="form-group-clickable" id="edit-age-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                    <div class="form-group"><label>种族</label><div class="form-group-clickable" id="edit-race-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                    <div class="form-group"><label>职业</label><div class="form-group-clickable" id="edit-occupation-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                    <div class="form-group"><label>简介</label><div class="form-group-clickable" id="edit-bio-trigger"><span class="value-display placeholder"></span><i class="fa-solid fa-chevron-right"></i></div></div>
                </div>
                <div id="modal-section-relationship" class="modal-section-pane"></div>
            </div>
        </div>
        <div class="sub-editor-panel" id="sub-editor-panel"><div class="sep-header"><button class="sep-btn" id="sep-back-btn"><i class="fa-solid fa-chevron-left"></i></button><h3 class="sep-title" id="sep-title">编辑</h3><button class="sep-btn sep-btn-save" id="sep-save-btn"><i class="fa-solid fa-check"></i></button></div><div class="sep-body"><textarea id="sep-textarea"></textarea></div></div>
        <div class="sub-editor-panel" id="item-editor-panel"><div class="sep-header"><button class="sep-btn" id="item-editor-back-btn"><i class="fa-solid fa-chevron-left"></i></button><h3 class="sep-title" id="item-editor-title-header">编辑条目</h3><button class="sep-btn sep-btn-save" id="item-editor-save-btn"><i class="fa-solid fa-check"></i></button></div><div class="sep-body iep-body"><input type="text" id="item-editor-title-input" placeholder="在此填入标题" maxlength="10"><textarea id="item-editor-value-textarea"></textarea></div></div>
    </div>
</div>
<div class="prompt-overlay" id="name-prompt-overlay"><div class="prompt-box"><h4>为新栏目命名</h4><input type="text" id="new-section-name-input" placeholder="请输入 2-4 个字符" maxlength="4"><div class="prompt-actions"><button id="cancel-prompt-btn" class="prompt-btn">取消</button><button id="confirm-prompt-btn" class="prompt-btn">确认</button></div></div></div>
<div class="bottom-sheet-overlay" id="custom-section-options-overlay"><div class="bottom-sheet"><ul class="bottom-sheet-actions"><li><button class="action-button" data-action="rename">编辑栏目名称</button></li><li><button class="action-button action-delete" data-action="delete">删除此栏目</button></li></ul><button class="bottom-sheet-cancel" id="cancel-options-sheet-btn">取消</button></div></div>
<div class="bottom-sheet-overlay" id="add-section-sheet-overlay"><div class="bottom-sheet"><div class="preset-tags-container" id="preset-tags-container"><button class="preset-tag preset-tag-custom" data-action="custom"><i class="fa-solid fa-plus"></i><span>自定义栏目</span></button></div><button class="bottom-sheet-cancel" id="cancel-add-sheet-btn">取消</button></div></div>
<div class="cropper-overlay" id="cropper-overlay"><div class="cropper-container"><div class="cropper-image-container"><img id="cropper-image" src=""></div><div class="cropper-actions"><button id="cancel-crop-btn" class="prompt-btn">取消</button><button id="confirm-crop-btn" class="prompt-btn">确认</button></div></div></div>
