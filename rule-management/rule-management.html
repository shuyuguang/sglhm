<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则提示词</title>
    
    <!-- 引入公共资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">
    
    <!-- 引入此页面的专属样式 -->
    <link rel="stylesheet" href="rule-management.css">

</head>
<body>
    <!-- 引入通用的模板脚本 -->
    <script src="../common/template.js"></script>
    
    <!-- 这个页面的专属逻辑脚本 -->
    <script src="rule-management.js"></script>
    
    <!-- 页面内容生成脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 定义“规则提示词”页面的专属内容
            const ruleManagementPageContent = `
                <!-- Tab 导航栏 -->
                <nav class="tabs-nav">
                    <div class="tabs-container">
                        <button class="tab-button active" data-tab="chat">聊天</button>
                        <button class="tab-button" data-tab="reading">阅读</button>
                        <button class="tab-button" data-tab="diary">日记</button>
                    </div>
                </nav>

                <!-- 用于显示小爱心的独立元素，放置在裁剪容器外部 -->
                <div class="active-tab-indicator"></div>

                <div class="main-container">
                    <main class="content-body">
                        <!-- Tab 内容面板 -->
                        <div class="tabs-content">
                            <div id="chat" class="tab-pane active">
                                <p>这里是【聊天】规则的设置区。</p>
                            </div>
                            <div id="reading" class="tab-pane">
                                <p>这里是【阅读】规则的设置区。</p>
                            </div>
                            <div id="diary" class="tab-pane">
                                <p>这里是【日记】规则的设置区。</p>
                            </div>
                        </div>
                    </main>
                </div>
            `;

            // 定义羽毛笔按钮的功能
            const handleRuleManagementFeatherClick = () => {
                console.log('羽毛笔被点击，可以在这里执行保存规则提示词相关设置的逻辑。');
            };

            // 调用 createPageLayout 生成页面
            createPageLayout({
                title: '规则提示词',
                contentHtml: ruleManagementPageContent,
                onFeatherClick: handleRuleManagementFeatherClick
            });
        });
    </script>
</body>
</html>
