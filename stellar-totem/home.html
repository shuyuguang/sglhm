<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家园</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">
</head>
<body>
    <script type="module">
        import { createPageLayout } from '../common/template.js';

        document.addEventListener('DOMContentLoaded', () => {
            const homePageContent = `
                <p>这里是家园页面</p>
            `;

            const handleHomeFeatherClick = () => {
                console.log('家园页面的羽毛笔被点击，准备布置家园。');
                alert('“布置家园”功能正在开发中！');
            };

            createPageLayout({
                title: '家园',
                contentHtml: homePageContent,
                onFeatherClick: handleHomeFeatherClick
            });
        });
    </script>
</body>
</html>
