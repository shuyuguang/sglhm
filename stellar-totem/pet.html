<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">
</head>
<body>
    <script type="module">
        import { createPageLayout } from '../common/template.js';

        document.addEventListener('DOMContentLoaded', () => {
            const petPageContent = `
                <p>这里是宠物页面</p>
            `;

            const handlePetFeatherClick = () => {
                console.log('宠物页面的羽毛笔被点击，准备领养新宠物。');
                alert('“领养新宠物”功能正在开发中！');
            };

            createPageLayout({
                title: '宠物',
                contentHtml: petPageContent,
                onFeatherClick: handlePetFeatherClick
            });
        });
    </script>
</body>
</html>
