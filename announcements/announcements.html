<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莲台昭示</title>
    
    <!-- 引入公共资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">

    <!-- 内联本页专属CSS (这部分保持不变) -->
    <style>
        .content-body {
            padding: 20px 15px;
        }
        .announcement-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .announcement-card {
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .announcement-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }
        .card-date {
            font-size: 0.85em;
            color: #868e96;
            margin-bottom: 8px;
            display: block;
        }
        .card-content {
            font-size: 1em;
            color: #495057;
            margin: 0;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <!-- 
      已删除 <script src="../common/template.js"></script> 
    -->
    
    <!-- ▼▼▼ 核心修改点 ▼▼▼ -->
    <script type="module">
        // 1. 从模块中导入函数
        import { createPageLayout } from '../common/template.js';

        document.addEventListener('DOMContentLoaded', () => {

            // 定义“莲台昭示”页面的专属内容
            const announcementsPageContent = `
                <div class="announcement-container">
                    <div class="announcement-card">
                        <span class="card-date">2025.9.17</span>
                        <p class="card-content">Felotus互动套壳机诞生，集养OC、DIY产粮、互动聊天于一体的新机，我称呼它菲洛图互动套壳机>𖥦<</p>
                    </div>
                    <div class="announcement-card">
                        <span class="card-date">2025.8.2</span>
                        <p class="card-content">Felotus初版小手机诞生，初版会在后续删减为聊天机内置在互动套壳机中，适合仅聊天的简约派~</p>
                    </div>
                </div>
            `;

            // 定义“莲台昭示”页面羽毛笔按钮的专属功能
            const handleAnnouncementsFeatherClick = () => {
                console.log('莲台昭示页面的羽毛笔被点击，但当前无功能。');
            };

            // 调用 createPageLayout 生成页面
            createPageLayout({
                title: '莲台昭示',
                contentHtml: announcementsPageContent,
                onFeatherClick: handleAnnouncementsFeatherClick
            });
        });
    </script>
</body>
</html>
