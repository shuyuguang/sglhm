<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陪伴</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">
</head>
<body>
    <!-- 
      这里不再需要 <script src="../common/template.js"></script>
      因为下面的模块脚本会通过 import 自动加载它
    -->
    
    <!-- ▼▼▼ 核心修改点 ▼▼▼ -->
    <script type="module">
        // 1. 从模块中导入 createPageLayout 函数
        import { createPageLayout } from '../common/template.js';

        document.addEventListener('DOMContentLoaded', () => {

            // 2. 定义“陪伴”页面的专属内容 (这部分不变)
            const accompanyPageContent = `
                <p>这里是陪伴页面</p>
            `;

            // 3. 定义“陪伴”页面羽毛笔按钮的专属功能 (这部分不变)
            const handleAccompanyFeatherClick = () => {
                console.log('陪伴页面的羽毛笔被点击，准备开始新的陪伴记录。');
                alert('“新增陪伴记录”功能正在开发中！');
            };

            // 4. 调用 createPageLayout 生成页面 (现在可以正常调用了)
            createPageLayout({
                title: '陪伴',
                contentHtml: accompanyPageContent,
                onFeatherClick: handleAccompanyFeatherClick
            });
        });
    </script>
</body>
</html>
