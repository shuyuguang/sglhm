<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. 修改页面标题 -->
    <title>陪伴</title>
    
    <!-- 引入公共资源 (路径和模板一样) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">

    <!-- 注意：这里我们没有添加任何专属的 <style> 标签，因为这个页面很简单 -->
</head>
<body>
    <!-- 引入通用的模板脚本 -->
    <script src="../common/template.js"></script>
    
    <!-- 这个页面的专属逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 2. 定义“陪伴”页面的专属内容
            const accompanyPageContent = `
                
                <p>这里是陪伴页面</p>
            `;

            // 3. 定义“陪伴”页面羽毛笔按钮的专属功能 (目前是占位符)
            const handleAccompanyFeatherClick = () => {
                console.log('陪伴页面的羽毛笔被点击，准备开始新的陪伴记录。');
                alert('“新增陪伴记录”功能正在开发中！');
            };

            // 4. 调用 createPageLayout 生成页面
            // 我们没有提供 onPageLoad 回调，所以帮助按钮会使用 template.js 中的默认 alert 功能
            createPageLayout({
                title: '陪伴', // 传入新的标题
                contentHtml: accompanyPageContent,
                onFeatherClick: handleAccompanyFeatherClick
            });
        });
    </script>
</body>
</html>
