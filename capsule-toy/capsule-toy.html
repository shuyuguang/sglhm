<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇迹垂钓</title>
    
    <!-- 引入公共资源 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>
    <!-- 
      已删除 <script src="../common/template.js"></script>

    <!-- ▼▼▼ 核心修改点 ▼▼▼ -->
    <script type="module">
        // 1. 从模块中导入函数
        import { createPageLayout } from '../common/template.js';

        document.addEventListener('DOMContentLoaded', () => {

            // 定义“奇迹垂钓”页面的专属内容
            const capsuleToyPageContent = `
                <p>这里是奇迹垂钓页面</p>
            `;

            // 定义“奇迹垂钓”页面羽毛笔按钮的专属功能
            const handleCapsuleToyFeatherClick = () => {
                console.log('奇迹垂钓页面的羽毛笔被点击，但当前无功能。');
            };

            // 调用 createPageLayout 生成页面
            createPageLayout({
                title: '奇迹垂钓',
                contentHtml: capsuleToyPageContent,
                onFeatherClick: handleCapsuleToyFeatherClick
            });
        });
    </script>
