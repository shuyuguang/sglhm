<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态广场</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../common/template.css">

    <!-- 专属样式 (这部分保持不变) -->
    <style>
        .header-actions {
            position: relative;
        }
        .help-tooltip {
            position: absolute; 
            top: calc(100% + 8px); 
            right: 0; 
            width: 270px;
            background-color: #ffffff;
            color: #000000;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
            font-size: 1em;
            line-height: 1.6;
            z-index: 101;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s 0.2s;
        }
        .help-tooltip.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s;
        }
        .help-tooltip p { margin: 0; }
        .help-tooltip::after {
            content: '';
            position: absolute;
            top: -8px;      
            right: 92px; 
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid #ffffff;
        }
    </style>
</head>
<body>
    <!-- 
        这里不再需要 <script src="../common/template.js"></script>
        它将由下面的模块脚本通过 import 自动加载
    -->

    <!-- ▼▼▼ 核心修改点 ▼▼▼ -->
    <script type="module">
        // 1. 从模块中导入 createPageLayout 函数
        import { createPageLayout } from '../common/template.js';

        document.addEventListener('DOMContentLoaded', () => {

            const activityPageContent = `<p>这里是动态广场页面</p>`;
            const handleFeatherClick = () => {
                console.log('动态广场页面的羽毛笔被点击，但当前无功能。');
            };

            const initializePageSpecificFeatures = () => {
                const helpButton = document.getElementById('help-btn');
                const headerActions = helpButton.closest('.header-actions');
                if (!helpButton || !headerActions) return;

                const tooltip = document.createElement('div');
                tooltip.id = 'help-tooltip';
                tooltip.className = 'help-tooltip';
                tooltip.innerHTML = `<p>这里是<strong>动态广场页面</strong>的专属帮助提示，介绍动态广场相关功能。</p>`;
                
                headerActions.appendChild(tooltip);

                helpButton.addEventListener('click', (event) => {
                    event.stopPropagation();
                    tooltip.classList.toggle('active');
                });

                document.addEventListener('click', (event) => {
                    if (tooltip.classList.contains('active') && !tooltip.contains(event.target)) {
                        tooltip.classList.remove('active');
                    }
                });
            };

            // 2. 现在可以正常调用 createPageLayout 了
            createPageLayout({
                title: '动态广场',
                contentHtml: activityPageContent,
                onFeatherClick: handleFeatherClick,
                onPageLoad: initializePageSpecificFeatures
            });
        });
    </script>
</body>
</html>
